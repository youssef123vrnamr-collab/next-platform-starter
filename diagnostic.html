<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تشخيص Firestore</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:20px;direction:rtl;line-height:1.8}
.line{margin:8px 0;padding:10px;border-radius:8px;background:#222;white-space:pre-wrap;word-break:break-all;font-size:14px}
.ok{color:#4f4;border:1px solid #4f4}
.err{color:#f66;border:1px solid #f66}
.wait{color:#fa0;border:1px solid #fa0}
</style>
</head>
<body>
<h2>🔍 تشخيص الاتصال بـ Firestore</h2>
<div id="log"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { initializeFirestore, doc, getDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const log = document.getElementById('log');
function add(msg, cls){
  const d = document.createElement('div');
  d.className = 'line ' + (cls||'');
  d.textContent = msg;
  log.appendChild(d);
}

add('1) جاري تهيئة Firebase App...', 'wait');
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyB-TFF6yvJyq21RxMD7KuAgNuVOBlXgNhY",
  authDomain:        "ginang-ca81d.firebaseapp.com",
  projectId:         "ginang-ca81d",
  storageBucket:     "ginang-ca81d.firebasestorage.app",
  messagingSenderId: "556233466817",
  appId:             "1:556233466817:web:f86580ee42b9e7f0f90540",
};

try{
  const app = initializeApp(FIREBASE_CONFIG);
  add('✅ تم تهيئة App بنجاح', 'ok');

  add('2) جاري تهيئة Firestore (forceLongPolling)...', 'wait');
  const db = initializeFirestore(app, { experimentalForceLongPolling: true });
  add('✅ تم تهيئة Firestore بنجاح', 'ok');

  add('3) جاري محاولة قراءة collection "admins" (مهلة 8 ثواني)...', 'wait');
  const t0 = Date.now();
  const timeoutP = new Promise((_, rej)=>setTimeout(()=>rej(new Error('TIMEOUT after 8s')), 8000));
  Promise.race([ getDocs(collection(db,'admins')), timeoutP ])
    .then(snap=>{
      const ms = Date.now()-t0;
      add('✅ نجحت القراءة في '+ms+'ms — عدد المستندات: '+snap.size, 'ok');
    })
    .catch(e=>{
      const ms = Date.now()-t0;
      add('❌ فشلت القراءة بعد '+ms+'ms: '+(e.code||'')+' — '+(e.message||e), 'err');
    });

}catch(e){
  add('❌ خطأ فوري: '+(e.code||'')+' — '+(e.message||e), 'err');
}

// فحص إضافي: هل fetch العادي لـ Firestore REST API بينجح؟ (بدون SDK خالص)
add('4) جاري تجربة Fetch مباشر لـ Firestore REST API...', 'wait');
const t1 = Date.now();
fetch('https://firestore.googleapis.com/v1/projects/ginang-ca81d/databases/(default)/documents/admins')
  .then(r=>r.json())
  .then(j=>{
    const ms = Date.now()-t1;
    add('✅ Fetch مباشر نجح في '+ms+'ms — الرد: '+JSON.stringify(j).slice(0,200), 'ok');
  })
  .catch(e=>{
    const ms = Date.now()-t1;
    add('❌ Fetch مباشر فشل بعد '+ms+'ms: '+(e.message||e), 'err');
  });
</script>
</body>
</html>
